; NIS-PPMS Security Settings
session.use_strict_mode = 1
session.cookie_httponly = 1
session.use_only_cookies = 1
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
display_errors = Off
log_errors = On
max_execution_time = 30
max_input_time = 30
memory_limit = 256M
post_max_size = 10M
upload_max_filesize = 5M